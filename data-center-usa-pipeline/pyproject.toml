[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenter-usa"
version = "0.1.0"
description = "US data center geospatial and business analysis project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "geopandas",
    "matplotlib",
    "contextily",
    "plotly",
    "requests",
    "pyogrio",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov",
]
db = [
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["datacenter_usa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a running PostgreSQL/PostGIS database"]
