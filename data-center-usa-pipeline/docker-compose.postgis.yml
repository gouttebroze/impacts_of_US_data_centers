services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: datacenter_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacenter}
      POSTGRES_USER: ${POSTGRES_USER:-datacenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432" 
  
    volumes:
      - datacenter_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  datacenter_postgis_data:
